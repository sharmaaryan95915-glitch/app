<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="wrap">
      <a href="/" class="logo">Portfolio<span>.</span></a>
      <a href="/" class="btn btn-sm">View full portfolio</a>
    </div>
  </nav>

  <main class="wrap" style="padding:40px 0 80px" id="main"></main>

  <script src="/common.js"></script>
  <script>
    const vid = location.pathname.split('/').pop();
    fetch('/api/videos/' + encodeURIComponent(vid)).then((r) => r.json()).then(({ profile, video, error }) => {
      if (error) {
        $('#main').innerHTML = `<div class="empty"><h3>Video not found</h3><p>This link may have been removed.</p></div>`;
        return;
      }
      setLogo(profile.name);
      document.title = `${video.title} — ${profile.name}`;
      $('#main').innerHTML = `
        <video src="${esc(video.url)}" controls playsinline ${video.thumbUrl ? `poster="${esc(video.thumbUrl)}"` : ''}
          style="width:100%;max-height:78vh;border-radius:18px;background:#000;border:1px solid var(--line)"></video>
        <div class="modal-info" style="padding-top:28px">
          <div>
            <h3 style="font-size:44px">${esc(video.title)}</h3>
            ${video.description ? `<p>${esc(video.description)}</p>` : ''}
            <div class="meta-list">
              ${video.client ? `<span>Client <b>${esc(video.client)}</b></span>` : ''}
              <span>Type <b>${esc(video.category)}</b></span>
              ${video.tools ? `<span>Tools <b>${esc(video.tools)}</b></span>` : ''}
              <span>Edited by <b>${esc(profile.name)}</b></span>
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:start">
            <button class="btn btn-sm" onclick="copyText(location.href)">Copy link</button>
            ${profile.email ? `<a class="btn btn-sm btn-primary" href="mailto:${esc(profile.email)}?subject=${encodeURIComponent('About: ' + video.title)}">Contact ${esc(profile.name.split(' ')[0])}</a>` : ''}
          </div>
        </div>`;
    });
  </script>
</body>
</html>
